trigger:
 branches:
   include:
     - main
     - feature/*

pool:
 vmImage: ubuntu-latest

stages:
  - stage: plan
    jobs:
      - job: plan
        steps:
          - template: installinit.yml
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'plan'
              workingDirectory: '$(System.DefaultWorkingDirectory)/module/dev'
              environmentServiceNameAzureRM: 'ser1'

  - stage: Approval
    dependsOn: Plan
    condition: succeeded()
    jobs:
    - job: WaitForApproval
      pool: server
      steps:
      - task: ManualValidation@0
        timeoutInMinutes: 1440
        inputs:
         notifyUsers: 'sidharthchaurasia064@gmail.com'
         instructions: 'Review Terraform Plan and approve to continue.'
         onTimeout: 'reject'

  - stage: apply
    dependsOn: Approval
    condition: succeeded()
    jobs:
      - job: terraformapply
        steps:
          - template: installinit.yml
          - task: TerraformTask@5
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(System.DefaultWorkingDirectory)/module/dev'
              environmentServiceNameAzureRM: 'ser1'



