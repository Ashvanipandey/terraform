
stages:
  - stage: terraform_install
    jobs:
      - job: terraforminstall
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
  - stage: terraform_init
    jobs:
      - job: terraforminit
        steps:
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: 'terraform init'
              workingDirectory: '(System.DefaultWorkingDirectory)/module/dev'
